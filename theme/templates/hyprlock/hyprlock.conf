# aptus: the fallback lock screen (02-isolation §4 row 36), written by aptus-theme and always started
# as `hyprlock -c <this file>`; Lenno's ~/.config/hypr/hyprlock.conf is never read or touched.
general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb({{ ground | hexnoh }})
}

label {
    monitor =
    text = $TIME
    color = rgb({{ inkMain | hexnoh }})
    font_family = {{ font.ui }}
    font_size = 64
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    outline_thickness = 2
    outer_color = rgb({{ line | hexnoh }})
    inner_color = rgb({{ raised | hexnoh }})
    font_color = rgb({{ inkMain | hexnoh }})
    check_color = rgb({{ accent | hexnoh }})
    fail_color = rgb({{ crit | hexnoh }})
    placeholder_text = Password
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
