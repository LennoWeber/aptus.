# aptus-theme-apps: generated from theme/tokens.json, do not edit (run aptus-theme-apps again)
[mgr]
cwd = { fg = "{{ink}}" }
hovered = { fg = "{{selection_fg}}", bg = "{{selection_bg}}" }
tab_active = { fg = "{{selection_fg}}", bg = "{{selection_bg}}" }
tab_inactive = { fg = "{{inkSoft}}", bg = "{{surfaceAlt}}" }
border_style = { fg = "{{line}}" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
overall = { fg = "{{ink}}", bg = "{{surfaceAlt}}" }

[filetype]
rules = [
  { name = "*/", fg = "{{link}}" },
  { name = "*", fg = "{{ink}}" },
]
