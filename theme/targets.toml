noctalia  = ["steam"]
mechanism = "lease"
template  = "steam/matugen.css"
out       = "steam/matugen.css"
slot      = "~/.steam/steam/steamui/skins/Material-Theme/css/main/colors/matugen.css"
present   = true
reload    = "none"

[[target]]
id        = "brave"
row       = 26
noctalia  = ["brave"]
mechanism = "never"
note      = "Noctalia's hook installs the theme into ~/.local/share/noctalia and Brave's preferences; aptus touches neither"

[[target]]
id        = "hyprtoolkit"
row       = 27
noctalia  = ["hyprtoolkit"]
mechanism = "lease"
template  = "hyprtoolkit/hyprtoolkit.conf"
out       = "hyprtoolkit/hyprtoolkit.conf"
slot      = "~/.config/hypr/hyprtoolkit.conf"
when      = "exists:~/.config/hypr"
reload    = "none"

[[target]]
id        = "icons"
row       = 28
noctalia  = ["papirus-icons"]
mechanism = "own"
own       = "icons"
when      = "exists:/usr/share/icons/Papirus"
reload    = "none"
note      = "aptus-icons-{dark,light}: Papirus with the accent's folder colour, selected by the leased icon-theme key"

[[target]]
id        = "cursor"
row       = 29
mechanism = "lease"
kind      = "dconf"
reload    = "none"
note      = "plus XCURSOR_THEME, XCURSOR_SIZE, HYPRCURSOR_SIZE in env.lua"
[target.dconf]
cursor-theme = "'{{ cursor.theme }}'"
cursor-size  = "{{ cursor.size }}"

[[target]]
id        = "spicetify"
row       = 30
noctalia  = ["spicetify"]
mechanism = "bake"
files     = [
  { template = "spicetify/Comfy.color.ini", out = "spicetify/Comfy.color.ini", name = "comfy", slot = "{config}/spicetify/Themes/Comfy/color.ini" },
  { template = "spicetify/Colorful.color.ini", out = "spicetify/Colorful.color.ini", name = "colorful", slot = "{config}/spicetify/Themes/Colorful/color.ini" },
]
present   = true
reload    = "bake:spotify:spicetify apply"
note      = "opt-in (isolation.bakeTargets); changes Spotify in Umbriel too until switched back"

[[target]]
id        = "libreoffice"
row       = 31
noctalia  = ["libreoffice"]
mechanism = "never"
note      = "its artifact lives in ~/.local/state/noctalia, which aptus never writes (I-1)"

[[target]]
id        = "yazi"
row       = 33
noctalia  = ["yazi"]
mechanism = "scope"
files     = [
  { template = "yazi/flavor.toml", out = "yazi/flavor.toml", at = "flavors/noctalia.yazi/flavor.toml" },
  { template = "yazi/tmtheme.xml", out = "yazi/tmtheme.xml", at = "flavors/noctalia.yazi/tmtheme.xml" },
  { template = "yazi/theme.toml", out = "yazi/theme.toml", at = "theme.toml", missing_only = true },
]
scope     = { into = "yazi", mirror = "{config}/yazi" }
when      = "exists:~/.config/yazi"
reload    = "none"
note      = "Noctalia's yazi flavor, wired by [flavor] in theme.toml (aptus adds one only when there is none)"

[[target]]
id        = "bat"
row       = 34
noctalia  = ["bat"]
mechanism = "own"
own       = "bat"
files     = [
  { template = "bat/aptus.tmTheme", out = "bat/aptus.tmTheme", dest = "{cache}/aptus/bat-src/themes/aptus.tmTheme" },
]
when      = "which:bat"
reload    = "none"
note      = "BAT_THEME=aptus with BAT_CACHE_PATH=~/.cache/aptus/bat; built with --target there, never into bat's shared default cache"

[[target]]
id        = "hyprland"
row       = 35
noctalia  = ["hyprland"]
mechanism = "own"
files     = [
  { template = "hyprland/generated.lua", out = "hyprland/generated.lua", dest = "{state}/aptus/hypr/generated.lua" },
]
reload    = "builtin:hyprland"

[[target]]
id        = "hyprlock"
row       = 36
mechanism = "own"
files     = [
  { template = "hyprlock/hyprlock.conf", out = "hyprlock/hyprlock.conf", dest = "{state}/aptus/hyprlock.conf" },
]
reload    = "none"
