[[target]]
id        = "gemini"
row       = 23
noctalia  = ["antigravity"]
mechanism = "never"
note      = "Noctalia's hook copies the theme seeds into ~/.gemini/config/config.json (app settings); theme.json alone paints nothing"

[[target]]
id        = "vscode"
row       = 24
noctalia  = ["vscode"]
mechanism = "lease"
files     = [
  { template = "vscode/NoctaliaTheme-color-theme.json", out = "vscode/code.json", name = "code", slot = "~/.vscode/extensions/noctalia.noctaliatheme-*/themes/NoctaliaTheme-color-theme.json" },
  { template = "vscode/NoctaliaTheme-color-theme.json", out = "vscode/codium.json", name = "codium", slot = "~/.vscode-oss/extensions/noctalia.noctaliatheme-*/themes/NoctaliaTheme-color-theme.json" },
  { template = "vscode/NoctaliaTheme-color-theme.json", out = "vscode/antigravity.json", name = "antigravity", slot = "~/.antigravity-ide/extensions/noctalia.noctaliatheme-*/themes/NoctaliaTheme-color-theme.json" },
]
present   = true
reload    = "none"
note      = "Reload Window in the editor"

[[target]]
