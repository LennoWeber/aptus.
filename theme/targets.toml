# theme/targets.toml: the target manifest (08-theming §5). One entry per row of 02-isolation §4.
# Adding an app is adding an entry here and its template under theme/templates/<id>/.
#
# Fields:
#   id         stable id (settings page, journal slot ids "<id>.<name>")
#   row        row of 02-isolation §4
#   noctalia   Noctalia template ids this entry covers (02 §4 coverage rule)
#   mechanism  lease | scope | own | bake | never   (02 §3)
#   kind       lease/bake: file | ini-sections | dconf   (02 §5.5; default file)
#   files      [{ template, out, slot | dest }]: template below theme/templates, out inside the
#              generation, slot = the leased artifact (lease/bake; may hold one `*`), dest = the Own
#              file. `template`/`out`/`slot` at the top level are the one-file shorthand.
#   sections   ini-sections: header globs
#   dconf      dconf: key (in /org/gnome/desktop/interface/) → value template; "" = record only
#   scope      scope: { into, mirror, replace } or { into, source, begin, end }
#   own        own: a builtin step besides writing `files` (icons | qt6ct | bat)
#   when       always | exists:<path> | which:<command>   (false → skipped, "Not installed")
#   present    true: lease only the slots that exist ("only if present" in 02 §4)
#   reload     none | signal:<comm>:<SIG> | exec:<command> | builtin:<name> | bake:<process>:<command>
#   note       shown on the settings page

# Noctalia templates whose output only another compositor reads: nothing in Hyprland loads them.
[inert]
umbriel = "Umbriel's own config: never touched (02 §4 row 32)"
niri = "read only by niri"
sway = "read only by sway"
labwc = "read only by labwc"
mango = "read only by mango"
scroll = "read only by scroll"

[[target]]
id        = "gtk3"
row       = 1
noctalia  = ["gtk3"]
mechanism = "lease"
template  = "gtk3/noctalia.css"
out       = "gtk3/noctalia.css"
slot      = "~/.config/gtk-3.0/noctalia.css"
when      = "exists:~/.config/gtk-3.0"
reload    = "none"

[[target]]
id        = "thunar"
row       = 37
noctalia  = ["thunar"]
mechanism = "lease"
template  = "thunar/thunar.thunar.css"
out       = "thunar/thunar.thunar.css"
slot      = "~/.config/gtk-3.0/noctalia-extensions/thunar.thunar.css"
present   = true
reload    = "none"
note      = "Noctalia's GTK 3 extension for Thunar (literal colours)"

[[target]]
id        = "gtk4"
row       = 2
noctalia  = ["gtk4"]
mechanism = "lease"
template  = "gtk4/noctalia.css"
out       = "gtk4/noctalia.css"
slot      = "~/.config/gtk-4.0/noctalia.css"
when      = "exists:~/.config/gtk-4.0"
reload    = "none"

[[target]]
id        = "dconf"
row       = 3
mechanism = "lease"
kind      = "dconf"
reload    = "none"
note      = "live through GSettings and the settings portal"
[target.dconf]
color-scheme        = "'prefer-{{ mode }}'"
icon-theme          = "'aptus-icons-{{ mode }}'"
accent-color        = "'{{ gnome.accent }}'"
font-name           = "'{{ font.uiApp }}'"
document-font-name  = "'{{ font.documentApp }}'"
monospace-font-name = "'{{ font.monoApp }}'"
gtk-theme           = ""

[[target]]
id        = "kde"
row       = 4
noctalia  = ["kcolorscheme"]
mechanism = "lease"
kind      = "ini-sections"
template  = "kde/kdeglobals"
out       = "kde/kdeglobals"
slot      = "~/.config/kdeglobals"
sections  = ["Colors:*", "ColorEffects:*", "WM"]
when      = "exists:~/.config/kdeglobals"
reload    = "builtin:kde"

[[target]]
id        = "qt6ct"
row       = 5
noctalia  = ["qt"]
mechanism = "own"
own       = "qt6ct"
files     = [
  { template = "qt6ct/qt6ct.conf", out = "qt6ct/qt6ct.conf", dest = "~/.config/qt6ct/qt6ct.conf" },
  { template = "qt6ct/aptus.conf", out = "qt6ct/aptus.conf", dest = "~/.config/qt6ct/colors/aptus.conf" },
]
when      = "which:qt6ct"
reload    = "none"
note      = "read only with QT_QPA_PLATFORMTHEME=qt6ct, which only Hyprland sets"

[[target]]
id        = "kitty"
row       = 6
noctalia  = ["kitty"]
mechanism = "scope"
template  = "kitty/noctalia.conf"
out       = "kitty/noctalia.conf"
scope     = { into = "kitty", mirror = "~/.config/kitty", replace = "themes/noctalia.conf" }
when      = "exists:~/.config/kitty"
reload    = "signal:kitty:SIGUSR1"

