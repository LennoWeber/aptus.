mechanism = "scope"
template  = "starship/palette.toml"
out       = "starship/palette.toml"
scope     = { into = "starship.toml", source = "{config}/starship.toml", begin = "# >>> NOCTALIA STARSHIP PALETTE >>>", end = "# <<< NOCTALIA STARSHIP PALETTE <<<" }
when      = "exists:~/.config/starship.toml"
reload    = "none"

