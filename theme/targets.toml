[[target]]
id        = "vesktop"
row       = 21
noctalia  = ["discord"]
mechanism = "lease"
files     = [
  { template = "vesktop/midnight.css", out = "vesktop/noctalia.theme.css", name = "midnight", slot = "{config}/vesktop/themes/noctalia.theme.css" },
  { template = "vesktop/material.css", out = "vesktop/noctalia-material.theme.css", name = "material", slot = "{config}/vesktop/themes/noctalia-material.theme.css" },
  { template = "vesktop/system24.css", out = "vesktop/discord-system24.css", name = "system24", slot = "{config}/vesktop/themes/discord-system24.css" },
  { template = "vesktop/midnight.css", out = "vesktop/flatpak-noctalia.theme.css", name = "flatpak-midnight", slot = "~/.var/app/dev.vencord.Vesktop/config/vesktop/themes/noctalia.theme.css" },
  { template = "vesktop/material.css", out = "vesktop/flatpak-noctalia-material.theme.css", name = "flatpak-material", slot = "~/.var/app/dev.vencord.Vesktop/config/vesktop/themes/noctalia-material.theme.css" },
  { template = "vesktop/system24.css", out = "vesktop/flatpak-discord-system24.css", name = "flatpak-system24", slot = "~/.var/app/dev.vencord.Vesktop/config/vesktop/themes/discord-system24.css" },
]
present   = true
reload    = "none"

