# aptus: the fallback lock screen (02-isolation §4 row 36), written by aptus-theme and always started
# as `hyprlock -c <this file>`; Lenno's ~/.config/hypr/hyprlock.conf is never read or touched.
general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(191613)
}

label {
    monitor =
    text = $TIME
    color = rgb(efe6d4)
    font_family = Inter
    font_size = 64
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    outline_thickness = 2
    outer_color = rgb(332d27)
    inner_color = rgb(231f1b)
    font_color = rgb(efe6d4)
    check_color = rgb(9acfae)
    fail_color = rgb(fa9d86)
    placeholder_text = Password
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
