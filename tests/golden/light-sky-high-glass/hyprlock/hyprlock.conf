# aptus: the fallback lock screen (02-isolation §4 row 36), written by aptus-theme and always started
# as `hyprlock -c <this file>`; Lenno's ~/.config/hypr/hyprlock.conf is never read or touched.
general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(f4ede1)
}

label {
    monitor =
    text = $TIME
    color = rgb(272119)
    font_family = Inter
    font_size = 64
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    outline_thickness = 2
    outer_color = rgb(d8cdbb)
    inner_color = rgb(ebe3d5)
    font_color = rgb(272119)
    check_color = rgb(1f5f86)
    fail_color = rgb(b03522)
    placeholder_text = Password
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
